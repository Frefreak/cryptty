[package]
name = "cryptty"
version = "0.1.0"
edition = "2024"
description = "A small software-rendered terminal for macOS and Linux"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
fontdb = "0.23"
portable-pty = "0.9"
nix = { version = "0.29", features = ["signal", "process"] }
softbuffer = { version = "0.4", default-features = false, features = [
    "wayland", "wayland-dlopen",
] }
swash = "0.2"
unicode-width = "0.2"
winit = { version = "0.30", default-features = false, features = [
    "rwh_06", "wayland", "wayland-dlopen", "wayland-csd-adwaita",
] }

[profile.release]
lto = "thin"
codegen-units = 1
