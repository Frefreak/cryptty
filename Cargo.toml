[package]
name = "cryptty"
version = "0.1.0"
edition = "2024"
description = "A small terminal for macOS and Linux"

[dependencies]
anyhow = "1"
wgpu = { version = "30", default-features = false, features = [
    "std", "metal", "vulkan", "wgsl",
] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
portable-pty = "0.9"
nix = { version = "0.29", features = ["signal", "process"] }
softbuffer = { version = "0.4", default-features = false, features = [
    "wayland", "wayland-dlopen",
] }
swash = "0.2"
unicode-width = "0.2"
vte = { version = "0.15", default-features = false }
base64 = "0.22"
memchr = "2"
arboard = { version = "3.6", default-features = false, features = [
    "wayland-data-control",
] }
winit = { version = "0.30", default-features = false, features = [
    "rwh_06", "wayland", "wayland-dlopen", "wayland-csd-adwaita",
] }

[profile.release]
lto = "thin"
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
crossfont = "0.9.0"
objc2 = "0.5.3"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSEvent"] }
objc2-foundation = { version = "0.2.2", features = [
    "NSAttributedString", "NSRange", "NSString",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
fontdb = "0.23"
