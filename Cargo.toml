[package]
name = "cryptty"
version = "0.1.0"
edition = "2024"
description = "A small terminal for macOS and Linux"

[dependencies]
anyhow = "1"
tempfile = "3"
wgpu = { version = "30", default-features = false, features = [
    "std", "metal", "vulkan", "wgsl",
] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
portable-pty = "0.9"
nix = { version = "0.29", features = ["signal", "process"] }
swash = "0.2"
unicode-width = "0.2"
vte = { version = "0.15", default-features = false }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = "1"
memchr = "2"
regex = "1"
arboard = { version = "3.6", default-features = false, features = [
    "wayland-data-control",
] }
winit = { version = "0.30", default-features = false, features = [
    "rwh_06", "wayland", "wayland-dlopen", "wayland-csd-adwaita", "serde",
] }

[dependencies.softbuffer]
git = "https://github.com/rust-windowing/softbuffer"
rev = "9a7c9caf4ac29a8ae361d68c9a5babb97e36dc70"
default-features = false
features = ["wayland", "wayland-dlopen"]

[profile.release]
lto = "thin"
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
core-text = "21"
crossfont = "0.9.0"
objc2 = "0.5.3"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSEvent"] }
objc2-foundation = { version = "0.2.2", features = [
    "NSAttributedString", "NSValue", "NSRange", "NSString",
] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["gles"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
fontdb = "0.23"

[dev-dependencies]
fontdb = "0.23"

[patch.crates-io]
crossfont = { path = "vendor/crossfont" }
