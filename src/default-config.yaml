font:
  family: FantasqueSansM Nerd Font Mono
  # Font size in points.
  size: 19
  # Swash hinting on Linux; macOS uses native font rendering.
  hinting: false
  # Ordered fallback families for characters missing from the primary font.
  fallback:
    - LXGW WenKai Mono Screen
  # Per-font lists of Unicode ranges; later mappings take priority.
  codepoint_map:
    - family: LXGW WenKai Mono Screen
      ranges:
        - U+2E80-U+9FFF
        - U+F900-U+FAFF
        - U+FE10-U+FE1F
        - U+FE30-U+FE4F
        - U+FF00-U+FFEF
        - U+20000-U+3FFFF
window:
  # macOS only: none, only_left, only_right, or both.
  option_as_alt: only_left
  padding:
    x: 2
    y: 2
keyboard:
  bindings:
    - key: j
      modifiers: [Control, Shift]
      action: VimMode
selection:
  # Additional word characters beside Unicode letters and digits.
  word_characters: '/\._-~:@%+=,#?'
colors:
  primary:
    foreground: '#f8f8f2'
    background: '#282a36'
  cursor:
    cursor: '#f8f8f2'
  normal:
    black: '#21222c'
    red: '#ff5555'
    green: '#50fa7b'
    yellow: '#f1fa8c'
    blue: '#bd93f9'
    magenta: '#ff79c6'
    cyan: '#8be9fd'
    white: '#f8f8f2'
  bright:
    black: '#6272a4'
    red: '#ff6e6e'
    green: '#69ff94'
    yellow: '#ffffa5'
    blue: '#d6acff'
    magenta: '#ff92df'
    cyan: '#a4ffff'
    white: '#ffffff'
