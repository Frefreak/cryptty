font:
  family: FantasqueSansM Nerd Font Mono
  # Font size in points.
  size: 19
  # Swash hinting on Linux; macOS uses native font rendering.
  hinting: false
  # Linux outline stroke thickening in physical pixels, from 0.0 to 1.0.
  embolden: 0.0
  # Ordered fallback families for characters missing from the primary font.
  fallback:
    - LXGW WenKai Mono Screen
  # Per-font lists of Unicode ranges; later mappings take priority.
  codepoint_map: []
window:
  # GPU background opacity, from 0.0 to 1.0; software remains opaque.
  opacity: 1.0
  # Native KDE Wayland blur; strength follows desktop settings.
  blur: false
  # OpenGL transparency storage: rgba16f or compact rgba8. Reopen to apply.
  opengl_color_format: rgba16f
  # macOS only: none, only_left, only_right, or both.
  option_as_alt: only_left
  padding:
    x: 2
    y: 2
keyboard:
  bindings:
    - key: j
      modifiers: [Control, Shift]
      action: VimMode
    - key: m
      modifiers: [Control, Shift]
      action: MarkerMode
markers:
  # Base badge and indicator color, in '#RRGGBB' or '0xRRGGBB' format.
  label_background: '#fef991'
  # Badge and indicator colors for overlapping targets; [] uses the base.
  accent_colors: ['#70c9ff', '#ff9fce', '#a6e89a']
  # Expand label strokes by 0 to 1 physical pixels on Linux and macOS.
  label_embolden: 0.3
  # Opacity from 0 (transparent) to 1 (opaque); label text stays opaque.
  label_opacity: 0.8
  indicator_opacity: 0.85
  # Minimum styled phrase length, including internal spaces.
  styled_min_length: 5
  # Hexadecimal tokens must include at least one letter.
  hash_min_length: 7
  # Maximum targets sharing a character; URL internals are suppressed.
  overlap_max: 2
  # Maximum unknown bare command name length for color-only recognition.
  command_name_max_length: 16
  # Additional command names; these still require color evidence.
  known_commands: []
  command_history:
    enabled: true
    # Currently supported history format: fish.
    shell: fish
    # null uses fish's standard data directory and history session name.
    path: null
    # Background refresh interval; unchanged history files are skipped.
    refresh_interval_seconds: 600
selection:
  # Additional word characters beside Unicode letters and digits.
  word_characters: '/\._-~:@%+=,#?'
colors:
  primary:
    foreground: '#f8f8f2'
    background: '#282a36'
  cursor:
    cursor: '#f8f8f2'
  normal:
    black: '#21222c'
    red: '#ff5555'
    green: '#50fa7b'
    yellow: '#f1fa8c'
    blue: '#bd93f9'
    magenta: '#ff79c6'
    cyan: '#8be9fd'
    white: '#f8f8f2'
  bright:
    black: '#6272a4'
    red: '#ff6e6e'
    green: '#69ff94'
    yellow: '#ffffa5'
    blue: '#d6acff'
    magenta: '#ff92df'
    cyan: '#a4ffff'
    white: '#ffffff'
