# User configuration. Press Ctrl+Shift+R after editing.
font:
  hinting: false
  # Optional font selection for separate Unicode ranges:
  # codepoint_map:
  #   - ranges: ["U+23CE", "U+25B2", "U+25BC", "U+2580-U+259F"]
  #     family: DejaVu Sans Mono
window:
  # GPU background opacity, from 0.0 to 1.0; software remains opaque.
  opacity: 1.0
  # Native KDE Wayland blur; strength follows desktop settings.
  blur: false
  padding:
    x: 2
    y: 2
colors:
  primary:
    background: "#282a36"
    foreground: "#f8f8f2"
  cursor:
    cursor: "#f8f8f2"
  normal:
    black: "#21222c"
    red: "#ff5555"
    green: "#50fa7b"
    yellow: "#f1fa8c"
    blue: "#6272a4"
    magenta: "#ff79c6"
    cyan: "#8be9fd"
    white: "#f8f8f2"
  bright:
    black: "#6272a4"
    red: "#ff6e6e"
    green: "#69ff94"
    yellow: "#ffffa5"
    blue: "#6272a4"
    magenta: "#ff92df"
    cyan: "#a4ffff"
    white: "#ffffff"

